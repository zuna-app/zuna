# Run with:  ZUNA_DOMAIN=chat.example.com docker compose up -d
# Then read your setup link with:  docker compose logs zuna
#
# Your domain must point at this machine, with ports 80 and 443 reachable.
# Certificates are obtained and renewed automatically.

services:
  zuna:
    build:
      context: ../server
    # Or use a published image instead of building:
    # image: ghcr.io/socketbyte/zuna-server:latest
    restart: unless-stopped
    # It only ever writes to its data volume, and needs no special powers.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZUNA_DOMAIN: ${ZUNA_DOMAIN:?Set ZUNA_DOMAIN to your domain name}
      # The push relays that may wake members' phones (docs/SELF_HOSTING.md#phone-notifications).
      ZUNA_PUSH_RELAYS: ${ZUNA_PUSH_RELAYS:-}
      # PostgreSQL to keep the data in, instead of SQLite in the volume (docs/SELF_HOSTING.md#postgresql).
      ZUNA_DATABASE_URL: ${ZUNA_DATABASE_URL:-}
    volumes:
      - zuna-data:/data

volumes:
  zuna-data:
