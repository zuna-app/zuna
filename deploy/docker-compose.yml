# Run with:  ZUNA_DOMAIN=chat.example.com docker compose up -d
# Then read your setup link with:  docker compose logs zuna
#
# Your domain must point at this machine, with ports 80 and 443 reachable.
# Certificates are obtained and renewed automatically.

services:
  zuna:
    build:
      context: ../server
    # Or use a published image instead of building:
    # image: ghcr.io/socketbyte/zuna-server:latest
    restart: unless-stopped
    # It only ever writes to its data volume, and needs no special powers.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZUNA_DOMAIN: ${ZUNA_DOMAIN:?Set ZUNA_DOMAIN to your domain name}
      # The push relays that may wake members' phones (docs/SELF_HOSTING.md#phone-notifications).
      ZUNA_PUSH_RELAYS: ${ZUNA_PUSH_RELAYS:-}
      ZUNA_DATABASE_URL: postgres://zuna@/zuna?host=/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - zuna-data:/data
      - zuna-postgres-socket:/run/postgresql

  # Accounts, conversations and their encrypted messages. It has no network at all:
  # Zuna reaches it through a socket in the volume they share, so it needs no password.
  postgres:
    # Its major version stays 18: a newer one can't open these files without moving
    # them over with pg_dump (docs/SELF_HOSTING.md#postgresql).
    image: postgres:18.6-alpine
    restart: unless-stopped
    network_mode: none
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: postgres -c listen_addresses=
    environment:
      POSTGRES_USER: zuna
      POSTGRES_DB: zuna
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: pg_isready -U zuna -d zuna
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - zuna-postgres:/var/lib/postgresql
      - zuna-postgres-socket:/var/run/postgresql

volumes:
  zuna-data:
  zuna-postgres:
  zuna-postgres-socket:
