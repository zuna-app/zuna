[package]
name = "zuna-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Zuna's end-to-end encryption core: OpenMLS group key agreement plus account-key and content primitives, compiled to WebAssembly for the web app and the tests, and natively for the desktop app and iOS."
publish = false

# A Rust library to the desktop app. The WebAssembly build and iOS's static library each ask for
# their own crate type (scripts/build-crypto.mjs, scripts/build-crypto-apple.mjs), so nothing else
# links a shared library nobody loads.
[lib]
crate-type = ["rlib"]

[features]
# The iOS app's bindings, which only its build asks for.
uniffi = ["dep:uniffi"]

[dependencies]
# draft-ietf-mls-pq-ciphersuites: the suite with ML-KEM-768 and X25519 together, which
# mls.rs uses, and X-Wing, which primitives.rs seals with (docs/POST_QUANTUM.md). It's the
# traits' and the provider's: openmls's own only adds the suites to a leaf's default
# capabilities, which mls.rs always sets, and names its optional SQLite storage's feature,
# which would put a second SQLite in the desktop app's lockfile.
openmls = "0.9"
openmls_rust_crypto = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
# ML-DSA (FIPS 204), signing beside Ed25519 (hybrid.rs). The version OpenMLS's provider uses.
ml-dsa = "0.1"
tls_codec = "0.5"
getrandom = "0.2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
# Tokens the server can't trace (RFC 9497), which limit what an unnamed sender may send.
voprf = { version = "0.5", default-features = false, features = ["ristretto255-ciphersuite"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# OpenMLS's own Ed25519, for a public key from a seed, which OpenMLS doesn't offer.
ed25519-dalek = "2"

# The web app and the tests load the core as WebAssembly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# The iOS app calls it through UniFFI, with the uniffi feature. The desktop app calls it as a
# Rust crate, without it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "0.32", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The tests make key packages as plain OpenMLS would, with one algorithm alone, which
# the client has to refuse.
[dev-dependencies]
openmls_basic_credential = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
