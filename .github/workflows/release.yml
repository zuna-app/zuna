name: Release

on:
  push:
    tags: ["v*"]

# Releases the native app, for Windows, Linux and macOS, which
# scripts/release.mjs tagged: v1.2.3 is a stable release, and
# v1.2.3-nightly.1108 a nightly. A nightly also sends the iPhone app to
# TestFlight. Each app is built only when something it's built from changed
# since it last shipped. docs/RELEASES.md says how it all fits together. The
# server, zuna-web and their images aren't released here yet (docs/ROADMAP.md).
#
# Nothing runs with more than it needs. Each app is built by a job that holds no
# secret but Telegram's api_id, which every installer carries anyway (the windows
# job says why), and can't publish anything, and the jobs that sign and publish run no
# build. Third-party actions are pinned to full commits, since a tag can be
# moved.
#
# What an installed app trusts is the manifest's signatures, made with its
# channel's keys, Ed25519's and ML-DSA-65's (UPDATE_SIGNING_KEY and
# UPDATE_SIGNING_KEY_PQ): the stable keys are secrets of the "release"
# environment and the nightly keys of "nightly", both of which only v* tags reach. An app on
# stable takes nothing the nightly key signed, so whatever cuts nightlies can't
# reach anyone who didn't choose them. A stable release also waits for ci.yml's
# tests, and a nightly's run only builds.
permissions:
  contents: read

# A nightly that's overtaken is cancelled, so two sessions that end close
# together leave one build, the newer. A stable release always finishes.
concurrency:
  group: ${{ contains(github.ref_name, '-nightly.') && 'release-nightly' || format('release-{0}', github.ref_name) }}
  cancel-in-progress: ${{ contains(github.ref_name, '-nightly.') }}

jobs:
  # What the tag releases. Fails unless it's annotated, on main, and agrees with
  # the version in package.json and, for a nightly, with its commit's number.
  # Says which apps to build, from the deployments of the environments that
  # ship each: a stable release always has the installers, and the iPhone app
  # only goes out with nightlies.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      label: ${{ steps.plan.outputs.label }}
      commit: ${{ steps.plan.outputs.commit }}
      environment: ${{ steps.plan.outputs.environment }}
      desktop: ${{ steps.plan.outputs.desktop }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      # All of main's history, as the build number is how many commits there are.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The checkout leaves the tag pointing at its commit, without its message.
      - run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" "+refs/heads/main:refs/remotes/origin/main"
      - id: plan
        run: node scripts/release.mjs plan "$GITHUB_REF_NAME"

  # Everything that tests what's shipped, before a stable release.
  checks:
    needs: [plan]
    if: ${{ needs.plan.outputs.channel == 'stable' }}
    uses: ./.github/workflows/ci.yml
    with:
      jobs: test advisories desktop

  windows:
    needs: [plan]
    if: ${{ needs.plan.outputs.desktop == 'true' }}
    runs-on: windows-latest
    # With room for building TDLib, when main's isn't saved.
    timeout-minutes: 90
    env:
      ZUNA_BUILD: ${{ needs.plan.outputs.build }}
      ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # What ci.yml's desktop job saved on main. A tag's own cache would be of
      # no use to the next tag, so nothing is saved here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: desktop-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-cargo-
      # TDLib as ci.yml's desktop job built it on main, or built here from source if it's not there.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/.deps/tdlib
          key: tdlib-windows-${{ hashFiles('scripts/tdlib.mjs') }}
      - run: npm ci
      # With the app's api_id for Telegram the engine is built and goes in the installer, and the
      # app links accounts; without it there's no Telegram. They're the one secret a build job
      # holds, as every installer carries them for anyone to read, as every Telegram client's
      # does: kept as the repository's secrets, they stay out of git and the logs, as Telegram
      # asks. Not an environment's, whose deployments say what's built.
      - run: npm run dist:windows
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: dist/windows/Zuna-Native-Setup-${{ needs.plan.outputs.label }}.exe
          if-no-files-found: error

  # The .deb, .rpm, pacman package, AppImage and .tar.gz, built in Debian 12 so
  # that the program runs wherever glibc is that old or newer.
  linux:
    needs: [plan]
    if: ${{ needs.plan.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    container: debian:12
    # TDLib takes a while more when ci.yml's linux job hasn't saved it.
    timeout-minutes: 90
    env:
      ZUNA_BUILD: ${{ needs.plan.outputs.build }}
      ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
      CC: clang-21
      CXX: clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # What the build links or reads headers of, what makes the packages, and clang 21.
      - run: sh scripts/linux-build-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # nfpm, which makes the three packages, runs through Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # TDLib as ci.yml's linux job built it on main, or built here from source if it's not there.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/.deps/tdlib
          key: tdlib-linux-${{ hashFiles('scripts/tdlib.mjs') }}
      - run: npm ci
      # With the app's api_id the Telegram engine is built and goes in every package, as the
      # windows job's comment says.
      - run: npm run dist:linux
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: dist/linux/packages/*
          if-no-files-found: error

  # The macOS app for Apple silicon, built in Release with FFmpeg from its
  # source, wrapped in its bundle with the Telegram engine, signed ad hoc, with
  # its DMG's backgrounds drawn beside it. Holds no secret but Telegram's
  # api_id, as the windows job says: the notarize job signs it. Runs on macOS
  # 27 with Xcode 27, like the iPhone app's jobs.
  macos:
    needs: [plan]
    if: ${{ needs.plan.outputs.desktop == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      ZUNA_BUILD: ${{ needs.plan.outputs.build }}
      ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # What ci.yml's macos job saved on main, as for Windows, and FFmpeg's source, which
      # scripts/ffmpeg.mjs checks against its hash before it's used, as ffmpeg.org drops connections.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/desktop/.deps/ffmpeg-*.tar.xz
          key: macos-cargo-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/media-ffmpeg/Cargo.lock', 'scripts/ffmpeg.mjs') }}
          restore-keys: macos-cargo-
      # GPUI compiles its Metal shaders as it builds, which Xcode 26 and later only can once the toolchain is there.
      - name: Get Xcode's Metal Toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      # TDLib as ci.yml's macos job built it on main, or built here from source if it's not there,
      # with CMake.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/.deps/tdlib
          key: tdlib-macos-${{ hashFiles('scripts/tdlib.mjs') }}
      - run: command -v cmake || brew install cmake
      - run: npm ci
      # With the app's api_id the Telegram engine is built and goes in the bundle, as the
      # windows job's comment says.
      - run: node scripts/macos-app.mjs release
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      # Zipped by ditto, which keeps what upload-artifact wouldn't: the executables' mode and the bundle's links.
      - run: ditto -c -k --keepParent dist/macos/Zuna.app dist/macos/Zuna.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-build
          path: |
            dist/macos/Zuna.app.zip
            dist/macos/dmg-background.png
            dist/macos/dmg-background@2x.png
          if-no-files-found: error

  # Signs the app with the Developer ID under the hardened runtime, has Apple
  # notarize it and staples the ticket, then makes its DMG, signed, notarized
  # and stapled too. Runs in the macos environment, which every release's tag
  # reaches and which holds the Developer ID's certificate and a notary key.
  # Builds nothing, and runs nothing from npm or Cargo: only Apple's tools,
  # scripts/macos-dist.mjs, which needs no npm install, and dmgbuild, pinned by
  # its hash.
  notarize:
    needs: [plan, macos]
    environment: macos
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ZUNA_LABEL: ${{ needs.plan.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-build
          path: built
      - run: ditto -x -k built/Zuna.app.zip built
      - name: Sign, notarize and package
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: node scripts/macos-dist.mjs sign built/Zuna.app built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: dist/macos/Zuna-${{ needs.plan.outputs.label }}-arm64.dmg
          if-no-files-found: error

  # Signs the manifest and publishes. A nightly doesn't wait for the checks,
  # which only run for a stable release.
  publish:
    needs: [plan, checks, windows, linux, notarize]
    if: ${{ !cancelled() && needs.plan.outputs.desktop == 'true' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.notarize.result == 'success' && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.plan.outputs.channel == 'nightly')) }}
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ needs.plan.outputs.label }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      # For the release script and the keys the app carries, and the tag's message.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      # Node 24, whose OpenSSL signs with ML-DSA-65, for update.json.sig2.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos
          path: artifacts
      - name: Write and sign the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PQ: ${{ secrets.UPDATE_SIGNING_KEY_PQ }}
          ZUNA_VERSION: ${{ needs.plan.outputs.version }}
          ZUNA_BUILD: ${{ needs.plan.outputs.build }}
          ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
          ZUNA_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/release.mjs manifest artifacts
      # Says which workflow run built each file; check one with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/*
      # The tag's message is the changelog. Only a stable release becomes "latest".
      - name: Publish the release
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ "$CHANNEL" = stable ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Zuna $LABEL" --notes-file notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Zuna $LABEL" --notes-file notes.md --prerelease --latest=false
          fi
      - name: Delete the nightlies past the newest
        if: ${{ needs.plan.outputs.channel == 'nightly' }}
        run: node scripts/release.mjs prune

  # The iPhone app, archived in Release with no signature, each bundle then
  # signed ad hoc with its entitlements so that the export keeps them, and
  # checked for test-only code. Holds no secret. Runs on macOS 27 with Xcode 27,
  # like ci.yml's ios job.
  ios:
    needs: [plan]
    if: ${{ needs.plan.outputs.ios == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ZUNA_BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm ci
      - run: npm run build:ios
      - run: node scripts/ios-dist.mjs archive
      # Zipped by ditto, which keeps what upload-artifact wouldn't: the executables' mode and the signatures' attributes.
      - run: ditto -c -k --keepParent dist/ios/Zuna.xcarchive dist/ios/Zuna.xcarchive.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios
          path: dist/ios/Zuna.xcarchive.zip
          if-no-files-found: error

  # Signs the archive for the App Store, checks every bundle's signature, build
  # and entitlements, and uploads it to TestFlight, marked for the team's own
  # testers. Runs in the testflight environment, which only nightly tags reach
  # and which holds the distribution certificate, the App Store profiles and an
  # App Store Connect key. Builds nothing, and runs nothing from npm, Cargo or
  # Swift's packages: only Xcode and scripts/ios-dist.mjs, which needs no npm
  # install.
  testflight:
    needs: [ios]
    environment: testflight
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios
          path: artifacts
      - run: ditto -x -k artifacts/Zuna.xcarchive.zip artifacts
      - name: Sign, check and upload to TestFlight
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_NOTIFICATIONS: ${{ secrets.IOS_PROFILE_NOTIFICATIONS }}
          IOS_PROFILE_BROADCAST: ${{ secrets.IOS_PROFILE_BROADCAST }}
          IOS_PROFILE_SHARE: ${{ secrets.IOS_PROFILE_SHARE }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/ios-dist.mjs upload artifacts/Zuna.xcarchive
