name: Release

on:
  push:
    tags: ["v*"]

# Nothing runs with more than it needs. Files are built and signed by jobs that
# can't publish anything, and the job that publishes runs no build. Third-party
# actions are pinned to full commits, since a tag can be moved.
#
# Whatever signs or publishes waits for every test and advisory check in ci.yml,
# and runs in the "release" environment. Its signing secrets belong there rather
# than in the repository, with the other maintainer as a required reviewer and
# only v* tags allowed, so that one account or token alone can't ship a release,
# whose binaries and images servers take as they are. It builds no desktop app
# yet: that job went with the Electron app, and the native app's is still to be
# written (docs/ROADMAP.md).
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: ZUNA_VERSION="${GITHUB_REF_NAME#v}" node scripts/build-server.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server
          path: dist/server/*
          if-no-files-found: error

  image:
    needs: [checks]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      # Image names can't have capitals.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-server:latest
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-server:${{ github.ref_name }}

  # zuna-web for each platform, with the web app inside, and the list of the app's
  # files that scripts/check-web.mjs compares a running copy with.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - run: npm ci
      - run: npm run build:crypto
      - run: ZUNA_VERSION="${GITHUB_REF_NAME#v}" npm run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web
          path: dist/web/*
          if-no-files-found: error
      # The same build for the zuna-web image, so that it serves exactly what
      # zuna-web-files.sha256 lists, without a second build that would only match
      # while Vite's output stays the same byte for byte.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-app
          path: apps/web/dist/
          if-no-files-found: error

  web-image:
    needs: [checks, web]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The web job's build, into server/cmd/zuna-web/site, where the image's build finds it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-app
          path: server/cmd/zuna-web/site
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          file: server/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-web:${{ github.ref_name }}

  publish:
    needs: [checks, server, image, web, web-image]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # What's released, by name: the web app's own files went into the zuna-web image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: server
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: artifacts
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      # Says which workflow run built each file; check one with `gh attestation verify`.
      # GitHub only offers this for public repositories on most plans.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: artifacts/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
