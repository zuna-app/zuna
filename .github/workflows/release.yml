name: Release

on:
  push:
    tags: ["v*"]

# Nothing runs with more than it needs. Files are built and signed by jobs that
# can't publish anything, and the job that publishes runs no build. Third-party
# actions are pinned to full commits, since a tag can be moved.
#
# Whatever signs or publishes waits for every test and advisory check in ci.yml,
# and runs in the "release" environment. Its signing secrets belong there rather
# than in the repository, with the other maintainer as a required reviewer and
# only v* tags allowed, so that one account or token alone can't ship an update
# that installed apps take on their own.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: ZUNA_VERSION="${GITHUB_REF_NAME#v}" node scripts/build-server.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server
          path: dist/server/*
          if-no-files-found: error

  image:
    needs: [checks]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      # Image names can't have capitals.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-server:latest
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-server:${{ github.ref_name }}

  # zuna-web for each platform, with the web app inside, and the list of the app's
  # files that scripts/check-web.mjs compares a running copy with.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 'name = "wasm-bindgen"' crypto/Cargo.lock | grep version | cut -d'"' -f2)"
      - run: npm ci
      - run: npm run build:crypto
      - run: ZUNA_VERSION="${GITHUB_REF_NAME#v}" npm run build:web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: dist/web/*
          if-no-files-found: error

  web-image:
    needs: [checks]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 'name = "wasm-bindgen"' crypto/Cargo.lock | grep version | cut -d'"' -f2)"
      - run: npm ci
      - run: npm run build:crypto
      # Puts the app in server/cmd/zuna-web/site, where the image's build finds it.
      - run: npm run build -w @zuna/web && cp -R apps/web/dist/. server/cmd/zuna-web/site/
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          file: server/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/zuna-web:${{ github.ref_name }}

  desktop:
    needs: [checks]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        shell: bash
        run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 'name = "wasm-bindgen"' crypto/Cargo.lock | grep version | cut -d'"' -f2)"
      - run: npm ci
      - run: npm run build:crypto
      # Screens share natively on Windows and Linux. A build without this shares through Chromium instead.
      - name: Install what native screen capture builds with
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y clang pkg-config libglib2.0-dev libva-dev
      # electron-builder makes the .rpm for Fedora and openSUSE with rpmbuild.
      - name: Install what the .rpm builds with
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y rpm
      - name: Build native screen capture
        if: matrix.os != 'macos-latest'
        shell: bash
        run: npm run build:screenshare
      # A build people install has to be able to prove where it came from. To publish
      # unsigned builds anyway, say so by setting the repository variable
      # ALLOW_UNSIGNED_RELEASE to true. Those builds won't update themselves.
      - name: Refuse to build without signing keys
        if: matrix.os != 'ubuntu-latest' && vars.ALLOW_UNSIGNED_RELEASE != 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$CSC_LINK" ] || missing="$missing CSC_LINK"
          [ -n "$CSC_KEY_PASSWORD" ] || missing="$missing CSC_KEY_PASSWORD"
          if [ "$RUNNER_OS" = macOS ]; then
            [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
            [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::These signing secrets are missing:$missing. Set them, or set the variable ALLOW_UNSIGNED_RELEASE to true."
            exit 1
          fi
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Only a signed build updates itself: an update must carry the same signature.
          ZUNA_SIGNED_BUILD: ${{ secrets.CSC_LINK != '' && '1' || '0' }}
        run: npm run dist
      # The native Windows app (apps/windows), signed with the same certificate, beside the
      # desktop's installer. It only updates itself from an installer signed the same.
      - name: Package the native Windows app
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/windows/Zuna-Native-Setup-*.exe
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.pacman
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: [checks, server, image, web, web-image, desktop]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      # Says which workflow run built each file; check one with `gh attestation verify`.
      # GitHub only offers this for public repositories on most plans.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: artifacts/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
