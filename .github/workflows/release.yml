name: build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            rpm \
            fakeroot \
            dpkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Make (DEB + RPM + ZIP + AppImage)
        working-directory: zuna-app
        run: yarn make
        env:
          DISPLAY: ":99"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zuna-app/out/make/**/*.deb
            zuna-app/out/make/**/*.rpm
            zuna-app/out/make/**/*.zip
            zuna-app/out/make/**/*.AppImage

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Make (Squirrel)
        working-directory: zuna-app
        run: yarn make

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zuna-app/out/make/**/*.exe
            zuna-app/out/make/**/*.nupkg

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Make (DMG + ZIP)
        working-directory: zuna-app
        run: yarn make
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zuna-app/out/make/**/*.zip
            zuna-app/out/make/**/*.dmg
