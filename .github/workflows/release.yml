name: Release

on:
  push:
    tags: ["v*"]

# Releases the native app, for Windows and Linux, which scripts/release.mjs
# tagged: v1.2.3 is a stable release, and v1.2.3-nightly.1108 a nightly. macOS
# isn't built here yet: it needs a Developer ID and notarizing in CI's secrets. docs/RELEASES.md says how it all
# fits together. The server, zuna-web and their images aren't released here
# yet (docs/ROADMAP.md).
#
# Nothing runs with more than it needs. The app is built by a job that holds no
# secret and can't publish anything, and the job that signs and publishes runs
# no build. Third-party actions are pinned to full commits, since a tag can be
# moved.
#
# What an installed app trusts is the manifest's signature, made with its
# channel's key: the stable key is a secret of the "release" environment and
# the nightly key of "nightly", both of which only v* tags reach. An app on
# stable takes nothing the nightly key signed, so whatever cuts nightlies can't
# reach anyone who didn't choose them. A stable release also waits for ci.yml's
# tests, and a nightly's run only builds.
permissions:
  contents: read

# A nightly that's overtaken is cancelled, so two sessions that end close
# together leave one build, the newer. A stable release always finishes.
concurrency:
  group: ${{ contains(github.ref_name, '-nightly.') && 'release-nightly' || format('release-{0}', github.ref_name) }}
  cancel-in-progress: ${{ contains(github.ref_name, '-nightly.') }}

jobs:
  # What the tag releases. Fails unless it's annotated, on main, and agrees with
  # the version in package.json and, for a nightly, with its commit's number.
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      label: ${{ steps.plan.outputs.label }}
      commit: ${{ steps.plan.outputs.commit }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      # All of main's history, as the build number is how many commits there are.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The checkout leaves the tag pointing at its commit, without its message.
      - run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" "+refs/heads/main:refs/remotes/origin/main"
      - id: plan
        run: node scripts/release.mjs plan "$GITHUB_REF_NAME"

  # Everything that tests what's shipped, before a stable release.
  checks:
    needs: [plan]
    if: ${{ needs.plan.outputs.channel == 'stable' }}
    uses: ./.github/workflows/ci.yml
    with:
      jobs: test advisories desktop

  windows:
    needs: [plan]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ZUNA_BUILD: ${{ needs.plan.outputs.build }}
      ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # What ci.yml's desktop job saved on main. A tag's own cache would be of
      # no use to the next tag, so nothing is saved here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: desktop-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-cargo-
      - run: npm ci
      - run: npm run dist:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: dist/windows/Zuna-Native-Setup-${{ needs.plan.outputs.label }}.exe
          if-no-files-found: error

  # The .deb, .rpm, pacman package, AppImage and .tar.gz, built in Debian 12 so
  # that the program runs wherever glibc is that old or newer.
  linux:
    needs: [plan]
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 60
    env:
      ZUNA_BUILD: ${{ needs.plan.outputs.build }}
      ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      # What the build links or reads headers of, and what makes the packages.
      - name: Install what the build needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils zstd unzip build-essential cmake clang libclang-dev pkg-config \n            libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev libpipewire-0.3-dev libglib2.0-dev libva-dev libdrm-dev libgbm-dev libegl-dev libdbus-1-dev \n            desktop-file-utils squashfs-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # nfpm, which makes the three packages, runs through Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: dist/linux/packages/*
          if-no-files-found: error

  # Signs the manifest and publishes. A nightly doesn't wait for the checks,
  # which only run for a stable release.
  publish:
    needs: [plan, checks, windows, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.plan.outputs.channel == 'nightly')) }}
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ needs.plan.outputs.label }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      # For the release script and the keys the app carries, and the tag's message.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: artifacts
      - name: Write and sign the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          ZUNA_VERSION: ${{ needs.plan.outputs.version }}
          ZUNA_BUILD: ${{ needs.plan.outputs.build }}
          ZUNA_CHANNEL: ${{ needs.plan.outputs.channel }}
          ZUNA_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/release.mjs manifest artifacts
      # Says which workflow run built each file; check one with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/*
      # The tag's message is the changelog. Only a stable release becomes "latest".
      - name: Publish the release
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ "$CHANNEL" = stable ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Zuna $LABEL" --notes-file notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Zuna $LABEL" --notes-file notes.md --prerelease --latest=false
          fi
      - name: Delete the nightlies past the newest
        if: ${{ needs.plan.outputs.channel == 'nightly' }}
        run: node scripts/release.mjs prune
