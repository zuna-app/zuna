name: Main

# Checks each push to main with ci.yml's test job: the type checks, the tests of the
# crypto core, the server, the core, the release script, the languages and the plugin
# SDK, and the web app's build. Two people and their sessions push straight to main,
# with no pull request, so this is what says when main is broken. A push that only
# changes the docs starts nothing. A run that started finishes, as main moves faster
# than the core's suite takes, and of the pushes that came meanwhile only the newest
# runs after it. The apps' builds stay with ci.yml, by hand, and with each release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      jobs: test
