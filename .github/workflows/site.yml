name: Site

# Builds zuna.chat and publishes it on GitHub Pages: on a push to main that changes it, and after each
# release, which brings new download links. The repository's Pages source has to be "GitHub Actions",
# with zuna.chat as its custom domain. Until the repository variable SITE_DEPLOY is "true", it only runs
# when started by hand, so pushes don't fail before Pages is set up. Third-party actions are pinned to
# full commits, as in release.yml.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/ui/src/styles/tokens.css"
      - ".github/workflows/site.yml"
  # A release made with GITHUB_TOKEN starts no workflow itself, so this follows Release finishing instead.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer one waits rather than cancelling one that's halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.SITE_DEPLOY == 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The site needs none of Electron, so its binary and every install script are left out.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The token lets the build see the latest release while the repository is private.
      - run: npm run build -w @zuna/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nothing goes out that requests another origin, breaks its policy or hides without script.
      - run: npx playwright-core install --with-deps chromium && node apps/site/test/site-check.mjs site-check chromium
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
