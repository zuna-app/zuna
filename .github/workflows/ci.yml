name: CI

on:
  # Each release: the Release workflow runs this first, and signs and publishes
  # nothing unless it passes.
  workflow_call:
  pull_request:

# Third-party actions are pinned to full commits, since a tag can be moved.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - run: npm ci
      - run: npm run test:crypto
      - run: npm run test:server
      - run: npm run build:crypto
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build -w @zuna/web

  # Known advisories in what's shipped.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: The server's Go modules
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: The npm packages the web app ships
        run: npm audit --omit=dev
      - name: The encryption core's crates
        working-directory: crypto
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  # The iOS app: its quick checks, the iOS core host against desktop clients,
  # the Release guard and the UI tests in a simulator (docs/IOS_TESTING.md).
  # It runs on macOS 27 with Xcode 27, like the development Mac; the macos-15
  # and macos-26 images only have Xcode 26.
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: ./.github/actions/wasm-bindgen
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm ci
      - run: npm run build:crypto
      - run: npm run build:ios
      - run: npm run test:ios:check
      - run: npm run test:ios
      - run: npm run test:ios:release
      - run: npm run test:ios:ui
      - name: Keep the UI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ui-tests
          path: |
            apps/ios/.e2e/*/summary.md
            apps/ios/.e2e/*/screens/
            apps/ios/.e2e/*/*.log
          if-no-files-found: ignore
