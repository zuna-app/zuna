name: CI

on:
  # Each stable release: the Release workflow runs the jobs it names first, and
  # signs and publishes nothing unless they pass.
  workflow_call:
    inputs:
      jobs:
        description: The jobs to run, by name with spaces between, or all of them
        type: string
        default: all
  pull_request:
  # By hand, as nothing runs on a push to main: gh workflow run ci.yml -f jobs=desktop
  workflow_dispatch:
    inputs:
      jobs:
        description: The jobs to run, by name with spaces between, or all of them
        type: string
        default: all

# Third-party actions are pinned to full commits, since a tag can be moved.
permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - run: npm ci
      - run: npm run test:crypto
      - run: npm run test:server
      - run: npm run build:crypto
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build -w @zuna/web

  # Known advisories in what's shipped.
  advisories:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'advisories') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: The server's Go modules
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: The npm packages the web app ships
        run: npm audit --omit=dev
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Each with its own .cargo/audit.toml of advisories that don't reach what's built, where it has any.
      - name: The crates of the encryption core, the native app with its screen share, and its media library
        run: |
          for crate in crypto apps/desktop apps/desktop/media-ffmpeg; do
            echo "> cargo audit in $crate"
            (cd "$crate" && cargo audit)
          done

  # The iOS app: the archive a nightly sends to TestFlight, made as release.yml
  # makes it but uploaded nowhere, its quick checks, the iOS core host against
  # desktop clients, the Release guard and the UI tests in a simulator
  # (docs/IOS_TESTING.md).
  # It runs on macOS 27 with Xcode 27, like the development Mac; the macos-15
  # and macos-26 images only have Xcode 26.
  ios:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'ios') }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: ./.github/actions/wasm-bindgen
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm ci
      - run: npm run build:crypto
      - run: npm run build:ios
      - run: node scripts/ios-dist.mjs archive
      - run: npm run test:ios:check
      - run: npm run test:ios
      - run: npm run test:ios:release
      - run: npm run test:ios:ui
      - name: Keep the UI test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-ui-tests
          path: |
            apps/ios/.e2e/*/summary.md
            apps/ios/.e2e/*/screens/
            apps/ios/.e2e/*/*.log
          if-no-files-found: ignore

  # The server's and the core's tests again, in PostgreSQL, whose SQL differs from
  # SQLite's in the ways CLAUDE.md lists. It hasn't been seen passing yet, so it
  # doesn't hold a release back: take continue-on-error away once it has.
  postgres:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'postgres') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: zuna
          POSTGRES_PASSWORD: zuna
          POSTGRES_DB: zuna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      ZUNA_TEST_POSTGRES: postgres://zuna:zuna@localhost:5432/zuna_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - run: npm ci
      - run: npm run build:crypto
      - run: npm run test:server
      - run: npm run test:core

  # The native desktop app, on Windows: the release build with its installer, as
  # a release makes it, then its tests and the screen share's, in the same
  # profile so that everything they share is built once, and the check of its
  # updates. Linux and macOS aren't
  # built here yet.
  desktop:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'desktop') }}
    runs-on: windows-latest
    # Building everything takes about 12 minutes on a runner with nothing cached, and TDLib
    # about 40 more when it isn't saved.
    timeout-minutes: 120
    env:
      # Windows Server has no Opus decoder, which Windows 10 and 11 get with their
      # Web Media Extensions, so the tests don't decode the fixtures' sound here.
      ZUNA_TEST_NO_OPUS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # GPUI comes from Zuna's fork of Zed, whose repository is large to fetch. The
      # build itself isn't kept: it's 3.6 GB, and fetching it would take as long.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: desktop-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-cargo-
      # TDLib, which the Telegram engine links, built from its pinned source in about 40 minutes
      # on a runner (scripts/tdlib.mjs). What's saved here on main is what release.yml's windows
      # job takes. It's saved as soon as it's built, so a later step that fails doesn't lose it.
      - id: tdlib
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/.deps/tdlib
          key: tdlib-windows-${{ hashFiles('scripts/tdlib.mjs') }}
      - run: npm ci
      - run: node scripts/tdlib.mjs
      - if: ${{ steps.tdlib.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/.deps/tdlib
          key: tdlib-windows-${{ hashFiles('scripts/tdlib.mjs') }}
      - run: npm run dist:windows
      - run: node scripts/windows-app.mjs test --release
      # The engine's own tests, which the app's leave out as it isn't one of the workspace's default members.
      - run: node scripts/windows-app.mjs test --release -- -p zuna-telegram
      # The app updating itself, from releases served on the runner (docs/RELEASES.md).
      - run: node apps/desktop/test/windows-update-check.mjs

  # The same app on macOS, built as a release builds it (the macos job in
  # release.yml, which this follows), signed ad hoc and notarized by nothing.
  # Saves the Cargo cache release.yml's macos job reads. Only by hand:
  # gh workflow run ci.yml -f jobs=macos
  macos:
    if: ${{ contains(inputs.jobs, 'macos') }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/desktop/.deps/ffmpeg-*.tar.xz
          key: macos-cargo-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/media-ffmpeg/Cargo.lock', 'scripts/ffmpeg.mjs') }}
          restore-keys: macos-cargo-
      - name: Get Xcode's Metal Toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: npm ci
      - run: node scripts/macos-app.mjs release
      - run: codesign --verify --strict --deep --verbose=2 dist/macos/Zuna.app && ls -l dist/macos

  # The same app's Linux packages, built as a release builds them (the linux job
  # in release.yml, which this follows). Only by hand: gh workflow run ci.yml -f jobs=linux
  linux:
    if: ${{ contains(inputs.jobs, 'linux') }}
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 60
    env:
      CC: clang-21
      CXX: clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # What the build links or reads headers of, what makes the packages, and clang 21.
      - run: sh scripts/linux-build-deps.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # nfpm, which makes the three packages, runs through Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run dist:linux
      - run: ls -l dist/linux/packages
