name: CI

on:
  # Each stable release: the Release workflow runs the jobs it names first, and
  # signs and publishes nothing unless they pass.
  workflow_call:
    inputs:
      jobs:
        description: The jobs to run, by name with spaces between, or all of them
        type: string
        default: all
  pull_request:
  # By hand, as nothing runs on a push to main: gh workflow run ci.yml -f jobs=desktop
  workflow_dispatch:
    inputs:
      jobs:
        description: The jobs to run, by name with spaces between, or all of them
        type: string
        default: all

# Third-party actions are pinned to full commits, since a tag can be moved.
permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - run: npm ci
      - run: npm run test:crypto
      - run: npm run test:server
      - run: npm run build:crypto
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build -w @zuna/web

  # Known advisories in what's shipped.
  advisories:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'advisories') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: The server's Go modules
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: The npm packages the web app ships
        run: npm audit --omit=dev
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Each with its own .cargo/audit.toml of advisories that don't reach what's built, where it has any.
      - name: The crates of the encryption core, the native app with its screen share, and its media library
        run: |
          for crate in crypto apps/desktop apps/desktop/media-ffmpeg; do
            echo "> cargo audit in $crate"
            (cd "$crate" && cargo audit)
          done

  # The iOS app: its quick checks, the iOS core host against desktop clients,
  # the Release guard and the UI tests in a simulator (docs/IOS_TESTING.md).
  # It runs on macOS 27 with Xcode 27, like the development Mac; the macos-15
  # and macos-26 images only have Xcode 26.
  ios:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'ios') }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: ./.github/actions/wasm-bindgen
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm ci
      - run: npm run build:crypto
      - run: npm run build:ios
      - run: npm run test:ios:check
      - run: npm run test:ios
      - run: npm run test:ios:release
      - run: npm run test:ios:ui
      - name: Keep the UI test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-ui-tests
          path: |
            apps/ios/.e2e/*/summary.md
            apps/ios/.e2e/*/screens/
            apps/ios/.e2e/*/*.log
          if-no-files-found: ignore

  # The server's and the core's tests again, in PostgreSQL, whose SQL differs from
  # SQLite's in the ways CLAUDE.md lists. It hasn't been seen passing yet, so it
  # doesn't hold a release back: take continue-on-error away once it has.
  postgres:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'postgres') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: zuna
          POSTGRES_PASSWORD: zuna
          POSTGRES_DB: zuna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      ZUNA_TEST_POSTGRES: postgres://zuna:zuna@localhost:5432/zuna_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          # setup-go keys its cache on a go.sum at the root by default.
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-bindgen
      - run: npm ci
      - run: npm run build:crypto
      - run: npm run test:server
      - run: npm run test:core

  # The native desktop app, on Windows: the release build with its installer, as
  # a release makes it, then its tests and the screen share's, in the same
  # profile so that everything they share is built once. Linux and macOS aren't
  # built here yet.
  desktop:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'desktop') }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # GPUI comes from Zuna's fork of Zed, whose repository is large to fetch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: desktop-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-cargo-
      - run: npm ci
      - run: npm run dist:windows
      - run: node scripts/windows-app.mjs test --release
      - name: How large the build is
        if: always()
        shell: bash
        run: du -sh "$LOCALAPPDATA/zuna-windows-target" "$LOCALAPPDATA/zuna-windows-target/release" ~/.cargo/git ~/.cargo/registry dist/windows/*.exe || true
