name: TDLib
description: >-
  Restores TDLib as tdlib.yml built it on main for this system, found by the stamp
  scripts/tdlib.mjs gives a build here, so that a change to the script that changes nothing
  built keeps it. Needs Node, and on Linux what scripts/linux-build-deps.sh installs, as the
  cache is found by how it was compressed too. What isn't there yet is built by the step that
  needs it.
inputs:
  system:
    description: windows, linux or macos for the native app's, in apps/desktop/.deps/tdlib, or ios for the iPhone app's, in apps/ios/.deps/tdlib
    required: true
  lookup-only:
    description: Only says whether it's saved, fetching nothing
    default: "false"
  verify:
    description: >-
      Keeps what was restored only if it's the build scripts/tdlib.mjs pins for its stamp, and
      otherwise leaves it to be built from source, as a release does: any job on main can save a
      cache under any key
    default: "false"
outputs:
  key:
    description: The key it's saved under
    value: ${{ steps.stamp.outputs.key }}
  path:
    description: Where it goes
    value: ${{ steps.stamp.outputs.path }}
  cache-hit:
    description: Whether it was saved
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: stamp
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
      run: |
        case "$SYSTEM" in
          ios) stamp=$(node scripts/tdlib.mjs --ios --stamp) path=apps/ios/.deps/tdlib ;;
          windows | linux | macos) stamp=$(node scripts/tdlib.mjs --stamp) path=apps/desktop/.deps/tdlib ;;
          *)
            echo "There's no TDLib for \"$SYSTEM\"." >&2
            exit 1
            ;;
        esac
        # "pinned": only builds tdlib.yml made since it prints each one's digest for BUILT in
        # scripts/tdlib.mjs, which a release holds what it restores to. Those saved before are
        # never taken, as nothing says what they are.
        echo "key=tdlib-pinned-$SYSTEM-$stamp" >> "$GITHUB_OUTPUT"
        echo "path=$path" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.stamp.outputs.path }}
        key: ${{ steps.stamp.outputs.key }}
        lookup-only: ${{ inputs.lookup-only }}
    - if: ${{ inputs.verify == 'true' && steps.restore.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
        TDLIB_PATH: ${{ steps.stamp.outputs.path }}
      run: |
        if ! node scripts/tdlib.mjs --check-built "$SYSTEM"; then
          echo "Building TDLib from source instead of the saved build." >&2
          rm -rf "$TDLIB_PATH"
        fi
