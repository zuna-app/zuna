<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zuna screen share demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #101114; color: #dfe3ea; overflow: hidden; font: 13px/1.4 ui-monospace, Consolas, monospace; }
  #clock { position: fixed; left: 0; top: 0; display: flex; z-index: 3; }
  #clock i { display: block; width: 24px; height: 24px; }
  #swatches { position: fixed; left: 0; top: 24px; display: flex; z-index: 3; }
  #swatches i { display: block; width: 48px; height: 48px; }
  #motion { position: fixed; inset: 0; z-index: 0; }
  #video { position: fixed; right: 16px; bottom: 16px; width: 640px; height: 360px; background: #000; border: 1px solid #39404d; z-index: 2; }
  #hud { position: fixed; right: 16px; top: 16px; width: 640px; background: #0b0c0ee8; border: 1px solid #39404d; padding: 10px 12px; white-space: pre; z-index: 2; }
</style>
</head>
<body>
<canvas id="motion"></canvas>
<div id="clock"></div>
<div id="swatches"></div>
<video id="video" autoplay muted playsinline></video>
<div id="hud">Connecting…</div>
<script type="module" src="/viewer.mjs"></script>
</body>
</html>
