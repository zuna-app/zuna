# The FFmpeg the repository pins for the screen capture (scripts/ffmpeg.mjs), which the app
# on Linux binds through ffmpeg-sys-next and links to, rather than whichever the system has.
[env]
FFMPEG_DIR = { value = "../screenshare/.deps/ffmpeg", relative = true }

# LiveKit's prebuilt libwebrtc uses the static C runtime, so everything else does too.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
