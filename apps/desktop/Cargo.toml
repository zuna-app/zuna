[package]
name = "zuna-windows"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Zuna's native Windows app, drawn with GPUI."
publish = false

[[bin]]
name = "zuna"
path = "src/main.rs"

[dependencies]
# Zed's own release on crates.io, published by the Zed team. Its defaults without X11, as the
# app only runs under Wayland on Linux. X11 means nothing on Windows, which builds as before.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "windows-manifest"] }

# The client core runs in QuickJS, as it runs in JavaScriptCore on iOS, and its
# cryptography is the same Rust crate the other apps use.
rquickjs = { version = "0.14", features = ["classes", "properties"] }
zuna-crypto = { path = "../../crypto" }

rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
x509-parser = "0.18"
sha2 = "0.10"
hkdf = "0.12"
futures = "0.3"
url = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
anyhow = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
unicode-segmentation = "1"
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
smallvec = "1"
dirs = "6"
open = "5"
raw-window-handle = "0.6"

# Voice channels and calls: LiveKit, as the native screen share uses it, whose frame
# encryption opens the desktop's, and RNNoise for the microphone. The sound devices are
# below, by system.
livekit = { version = "=0.10.0", features = ["rustls-tls-native-roots"] }
nnnoiseless = { version = "0.5", default-features = false }

# What the app asks of Linux: D-Bus for notifications and the badge, the Secret Service for the
# device key (as GPUI's own credentials use it), the tray's StatusNotifierItem, the location
# portal (ashpd, as GPUI's own portals), and Wayland's idle notifications, on a connection apart
# from GPUI's.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
# Notifications' initials, drawn with the resvg GPUI already has.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
# The sound devices, the notification sound's too: listed by the names PipeWire gives them, and
# played and recorded through it, as ALSA's own list holds hardware that playing takes away
# from PipeWire. 0.3.49's is for how much a stream is asked for each time.
pipewire = { version = "0.10", features = ["v0_3_49"] }
# Cameras, read through V4L2 as Chromium reads them.
v4l = "0.14"
# Media: reading and writing voice and video messages, videos and sound files, through the
# FFmpeg the repository pins for the screen capture (FFMPEG_DIR in .cargo/config.toml).
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The sound devices, through WASAPI.
cpal = "0.16"
# What windows's macro for declaring a COM interface expands to.
windows-core = "0.61"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Memory",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[patch.crates-io]
# GPUI 0.2.2, carried here to change how it draws on Windows: vendor/gpui/ZUNA.md lists how.
gpui = { path = "vendor/gpui" }
# xattr 0.2.3, which GPUI's HTTP client takes in through zed-async-tar on Unix, with the one
# line that no longer builds against libc on Linux changed (vendor/gpui/ZUNA.md).
xattr = { path = "vendor/xattr" }

[build-dependencies]
# The app's icon, compiled into the exe as Windows expects.
embed-resource = "3"

[profile.dev]
# The core's argon2 and MLS are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = "debuginfo"
