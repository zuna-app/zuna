[package]
name = "zuna-windows"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Zuna's native desktop app, for Windows, Linux and macOS, drawn with GPUI."
publish = false

[[bin]]
name = "zuna"
path = "src/main.rs"

# The screen share's capture, encoding and sound is a crate of its own (screenshare/Cargo.toml says
# why), with this lockfile and target folder, and its tests run with the app's. The media library
# on macOS and the Linux checks' driver are built apart, each with a lockfile of its own.
[workspace]
members = ["screenshare"]
default-members = [".", "screenshare"]
exclude = ["media-ffmpeg", "test/driver"]

[dependencies]
# GPUI from Zed's v1.27.0 release with Zuna's changes on top, from the `zuna/v1.27.0` branch of
# zuna-app/zed, pinned to a commit. Its ZUNA.md lists the changes and how to move to a newer
# release. Without X11, as the app only runs under Wayland on Linux.
gpui = { git = "https://github.com/zuna-app/zed", rev = "c5e567c7b0bd8b29b60b0673d80eb044e4d20c8d", default-features = false, features = ["font-kit", "wayland", "windows-manifest"] }
gpui_platform = { git = "https://github.com/zuna-app/zed", rev = "c5e567c7b0bd8b29b60b0673d80eb044e4d20c8d", default-features = false, features = ["font-kit", "wayland"] }

# The client core runs in QuickJS, as it runs in JavaScriptCore on iOS, and its
# cryptography is the same Rust crate the other apps use.
rquickjs = { version = "0.14", features = ["classes", "properties"] }
zuna-crypto = { path = "../../crypto" }

rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
# HTTP and WebSocket at the versions LiveKit's signalling has, so there's one copy of each.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "http2", "stream"] }
x509-parser = "0.18"
sha2 = "0.10"
hkdf = "0.12"
futures = "0.3"
url = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
parking_lot = "0.12"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
unicode-segmentation = "1"
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
smallvec = "1"
dirs = "6"
raw-window-handle = "0.6"

# Voice channels, calls and screen shares: LiveKit, whose frame encryption opens the web's and
# the iPhone's, and RNNoise for the microphone. The sound devices are below, by system.
livekit = { version = "=0.10.0", features = ["rustls-tls-native-roots"] }
nnnoiseless = { version = "0.5", default-features = false }
# Capturing a screen and encoding it on the GPU, and a share's sound, in this process.
zuna-screenshare = { path = "screenshare" }

# What the app asks of Linux: D-Bus for notifications and the badge, the Secret Service for the
# device key (as GPUI's own credentials use it), the tray's StatusNotifierItem, the location
# portal (ashpd, as GPUI's own portals), and Wayland's idle notifications, on a connection apart
# from GPUI's.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# oo7 and ashpd as GPUI's own: Zed's oo7 at the revision GPUI pins, and the ashpd it uses.
oo7 = { git = "https://github.com/zed-industries/oo7", rev = "731c1215edb6905876c6137ab300428c7b8d7c13", version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "location"] }
# The sound devices, the notification sound's too: listed by the names PipeWire gives them, and
# played and recorded through it, as ALSA's own list holds hardware that playing takes away
# from PipeWire. 0.3.49's is for how much a stream is asked for each time.
pipewire = { version = "0.10", features = ["v0_3_49"] }
# Cameras, read through V4L2 as Chromium reads them.
v4l = "0.14"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"
# Media: reading and writing voice and video messages, videos and sound files, through the
# FFmpeg the repository pins (FFMPEG_DIR in .cargo/config.toml), which the screen share encodes
# through too. On macOS the same code is built into a library of its own (media-ffmpeg).
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

# Notifications' initials on Linux and macOS, drawn with the resvg GPUI already has.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }

# The sound devices: through WASAPI on Windows, and Core Audio on macOS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
# What windows's macro for declaring a COM interface expands to.
windows-core = "0.61"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Memory",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# What the app asks of macOS, through AppKit and the frameworks beside it, at the versions GPUI
# already takes, and the Keychain for the device key.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSUserDefaults", "NSFormatter", "NSDateFormatter", "NSLocale", "NSThread", "NSURL", "NSError", "NSBundle", "NSObject", "NSSet", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSAccessibility", "NSDockTile", "NSWorkspace", "NSResponder", "NSRunningApplication"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventSource", "CGEventTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFMachPort", "CFRunLoop", "CFDate"] }
objc2-user-notifications = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVCaptureSession", "AVCaptureSessionPreset", "AVMediaFormat", "objc2-core-media", "block2", "dispatch2"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
dispatch2 = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = ["SCContentSharingPicker", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media"] }
objc2-core-location = { version = "0.3", features = ["CLLocation", "CLLocationManager", "CLLocationManagerDelegate", "CLError"] }
block2 = "0.6"
security-framework = "3"
# The media library, loaded as the app needs it.
libloading = "0.8"

[build-dependencies]
# The app's icon, compiled into the exe as Windows expects.
embed-resource = "3"

[features]
# For the checks alone (apps/desktop/test): the app takes input and gives screenshots of its
# window over a socket of its own (`test_control.rs`). Never in a build anyone uses.
test-control = ["gpui/test-support", "gpui_platform/test-support"]
# The screen share through LiveKit with someone watching, for test/key-log-check.mjs, which
# `cargo test` would otherwise build each time.
share-check = []

[[example]]
name = "share-check"
required-features = ["share-check"]

# LiveKit's webrtc-sys with Zuna's patch, which lets AV1 go out end to end encrypted
# (patches/webrtc-sys.patch). scripts/webrtc-sys.mjs fetches it into .deps, as the app's scripts do
# first, at the version Cargo.lock had for it from crates.io.
[patch.crates-io]
webrtc-sys = { path = ".deps/webrtc-sys" }

[profile.dev]
# The core's argon2 and MLS are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = "debuginfo"
