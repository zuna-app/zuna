[package]
name = "zuna-telegram"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The engine a linked Telegram account runs in: TDLib, in a process of its own, which the native app starts and talks to over its pipes."
publish = false

# A program of its own, which the app starts (src/telegram), so that the app links none of TDLib
# and a device that never links an account never runs it (docs/TELEGRAM_PLAN.md). A member of the
# app's workspace, with its lockfile and target folder, but not a default one: TDLib has to be
# built first (scripts/tdlib.mjs), which the app's scripts do before building it with
# `-p zuna-telegram`, and `cargo build` and `cargo test` of the app need none of it.
#
# It has no network of its own: TDLib is given a SOCKS5 proxy on this process's own loopback,
# which carries each connection over the pipe to the app (src/door.rs), and the app opens the
# real one, to Telegram's addresses only.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
