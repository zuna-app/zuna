[package]
name = "zuna-watch"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The window a video watched together plays in on Linux: WebKitGTK, which the native app starts and talks to over its pipes."
publish = false

# A program of its own, which the app starts (src/platform/linux/watch_view.rs), so that the app
# runs without WebKitGTK, which only zuna-watch needs. A member of the app's workspace, with its
# lockfile and target folder, but not a default one: it's built by scripts/linux-app.mjs and the
# Linux checks, with `-p zuna-watch`, and `cargo run` on any system stays the app's.

[dependencies]
serde_json = "1"

# WebKitGTK 6.0, on GTK 4, which gives GTK, GLib and JavaScriptCore at the versions it was built
# with, and its GStreamer, loaded as it is to ask which decoders there are.
[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = "0.5"
futures-channel = "0.3"
futures-util = "0.3"
libc = "0.2"
libloading = "0.8"
