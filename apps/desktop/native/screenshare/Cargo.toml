[package]
name = "zuna-screenshare"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native screen capture and GPU encoding, published through LiveKit."
publish = false

[features]
default = ["livekit"]
# Without this it can only write to a file, which also builds without a C++ compiler.
livekit = ["dep:livekit", "dep:livekit-api"]

[dependencies]
livekit = { version = "=0.10.0", optional = true }
livekit-api = { version = "=0.10.0", default-features = false, features = ["access-token"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }
libloading = "0.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = "line-tables-only"
