appId: chat.zuna.app
productName: Zuna
copyright: Zuna contributors. Licensed under AGPL-3.0.
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/icon.png
  - "!**/*.map"
protocols:
  - name: Zuna invite link
    schemes:
      - zuna
publish:
  provider: github
  owner: SocketByte
  repo: zuna-chat
# Closes the ways of running this app as something else, or with changed code.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Zuna-Setup-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # Automatic updates on macOS come from this one.
    - target: zip
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Zuna uses the microphone to record voice messages.
  artifactName: Zuna-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon.png
  # The default comes from the package name, @zuna/desktop, which isn't a valid file name.
  executableName: zuna
  # Names the .desktop file after desktopName in package.json, which Electron uses
  # as the window's app ID, so the desktop links the window to its icon.
  syncDesktopName: true
  category: Network;InstantMessaging
  maintainer: Zuna contributors <zuna@users.noreply.github.com>
  artifactName: Zuna-${version}-${arch}.${ext}
