appId: chat.zuna.app
productName: Zuna
copyright: Zuna contributors. Licensed under AGPL-3.0.
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/icon.png
  - "!**/*.map"
# The key hook for push to talk comes built for each system, against an interface that
# doesn't change between versions of Electron, so nothing has to be compiled.
npmRebuild: false
afterPack: ./scripts/after-pack.mjs
# A native module can't load from inside the archive.
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
# Captures and encodes a screen on the GPU, where it was built, and the computer's sound for a share,
# which is all it does on macOS. A build without it shares through Chromium.
extraResources:
  - from: ../screenshare/dist
    to: screenshare
    filter: ["**/*"]
protocols:
  - name: Zuna invite link
    schemes:
      - zuna
publish:
  provider: github
  owner: SocketByte
  repo: zuna-chat
# Closes the ways of running this app as something else, or with changed code.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Zuna-Setup-${version}.${ext}
# Apple silicon only: no build for Intel Macs is published.
mac:
  target:
    - target: dmg
      arch: [arm64]
    # Automatic updates on macOS come from this one.
    - target: zip
      arch: [arm64]
  icon: resources/icon.png
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Zuna uses the microphone for voice messages and voice channels.
    NSCameraUsageDescription: Zuna uses the camera when you turn it on in a voice channel.
    NSAudioCaptureUsageDescription: Zuna records your computer's sound only while you share your screen with sound.
    NSLocationUsageDescription: Zuna uses your location only when you choose to share it in a chat.
    NSLocationWhenInUseUsageDescription: Zuna uses your location only when you choose to share it in a chat.
  artifactName: Zuna-${version}-${arch}.${ext}
# Each package installs zuna.desktop in /usr/share/applications. An AppImage or a .tar.gz
# writes this person's own as it starts (src/main/desktop-entry.ts).
linux:
  target:
    # Debian and Ubuntu.
    - target: deb
      arch: [x64]
    # Fedora and openSUSE.
    - target: rpm
      arch: [x64]
    # Arch.
    - target: pacman
      arch: [x64]
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  # One for each size in hicolor, from scripts/make-icons.mjs.
  icon: resources/icons
  # The default comes from the package name, @zuna/desktop, which isn't a valid file name.
  executableName: zuna
  # Names the .desktop file after desktopName in package.json, which Electron uses
  # as the window's app ID, so the desktop links the window to its icon.
  syncDesktopName: true
  category: Network;InstantMessaging
  maintainer: Zuna contributors <zuna@users.noreply.github.com>
  artifactName: Zuna-${version}-${arch}.${ext}
# What Electron and the key hook for push to talk link, and load as they go: notifications,
# the secret store for the device key, and xdg-utils for links. electron-builder's own list
# names packages as Fedora does, which openSUSE doesn't, so this names the libraries,
# which both provide by the same name.
rpm:
  # The rpm and pacman packages would be named after the product, Zuna, which neither
  # Fedora nor Arch name a package with. The .deb is lowercased anyway. Only each
  # package's own options take a name, not linux's.
  packageName: zuna
  depends:
    - libgtk-3.so.0()(64bit)
    - libnss3.so()(64bit)
    - libasound.so.2()(64bit)
    - libgbm.so.1()(64bit)
    - libcups.so.2()(64bit)
    - libnotify.so.4()(64bit)
    - libsecret-1.so.0()(64bit)
    - libXtst.so.6()(64bit)
    - libXt.so.6()(64bit)
    - xdg-utils
# electron-builder's own list is for an Electron from the system, with packages Arch has dropped.
pacman:
  packageName: zuna
  depends:
    - gtk3
    - nss
    - alsa-lib
    - mesa
    - libcups
    - libnotify
    - libsecret
    - libxtst
    - libxt
    - xdg-utils
