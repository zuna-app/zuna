appId: chat.zuna.app
productName: Zuna
copyright: Zuna contributors. Licensed under AGPL-3.0.
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/icon.png
  - "!**/*.map"
# The key hook for push to talk comes built for each system, against an interface that
# doesn't change between versions of Electron, so nothing has to be compiled.
npmRebuild: false
# A native module can't load from inside the archive.
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
# Captures and encodes a screen on the GPU, where it was built. A build without it shares through Chromium.
extraResources:
  - from: native/screenshare/dist
    to: screenshare
    filter: ["**/*"]
protocols:
  - name: Zuna invite link
    schemes:
      - zuna
publish:
  provider: github
  owner: SocketByte
  repo: zuna-chat
# Closes the ways of running this app as something else, or with changed code.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Zuna-Setup-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # Automatic updates on macOS come from this one.
    - target: zip
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Zuna uses the microphone for voice messages and voice channels.
    NSCameraUsageDescription: Zuna uses the camera when you turn it on in a voice channel.
    NSLocationUsageDescription: Zuna uses your location only when you choose to share it in a chat.
    NSLocationWhenInUseUsageDescription: Zuna uses your location only when you choose to share it in a chat.
  artifactName: Zuna-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon.png
  # The default comes from the package name, @zuna/desktop, which isn't a valid file name.
  executableName: zuna
  # Names the .desktop file after desktopName in package.json, which Electron uses
  # as the window's app ID, so the desktop links the window to its icon.
  syncDesktopName: true
  category: Network;InstantMessaging
  maintainer: Zuna contributors <zuna@users.noreply.github.com>
  artifactName: Zuna-${version}-${arch}.${ext}
