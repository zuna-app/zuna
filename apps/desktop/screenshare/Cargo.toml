[package]
name = "zuna-screenshare"
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The native app's screen capture, GPU encoding and a share's sound, which it runs in its own process."
publish = false

# A crate of its own, rather than modules of the app, so that its Linux and macOS code can be
# checked from any system (`cargo check --target …` with ZUNA_CHECK_ONLY set, see build.rs): it
# needs neither LiveKit nor GPUI, whose builds need that system's own tools. The app hands each
# encoded frame to LiveKit itself, through `Output`.

[dependencies]
log = "0.4"
libloading = "0.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# What windows's macro for declaring a COM interface expands to.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The ScreenCast portal over the app's own async-io, as GPUI's portals and the app's location go:
# ashpd and zbus take tokio over async-io for every connection in the process where either asks for it.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
futures-executor = "0.3"

# Core Audio's process taps, for the computer's sound, and its converter for 48 kHz.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-audio-toolbox = "0.3"

[build-dependencies]
cc = "1"
