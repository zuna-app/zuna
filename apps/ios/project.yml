# XcodeGen spec for the iOS app. The .xcodeproj is generated from this file
# (npm run ios:project) and isn't committed.

name: Zuna
options:
  bundleIdPrefix: chat.zuna
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: SGKB9R23YT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "15"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # The push relay the app registers with (docs/PUSH_RELAY.md).
    ZUNA_PUSH_RELAY: "https://relay.mgalazka.pl"
    # Warnings fail the build of the app's own targets when ZUNA_WARNINGS_AS_ERRORS=YES
    # (scripts/check-ios.mjs). Set on the command line, SWIFT_TREAT_WARNINGS_AS_ERRORS
    # would also reach the packages, whose warnings SwiftPM suppresses, and fail.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(ZUNA_WARNINGS_AS_ERRORS)

packages:
  ZunaKit:
    path: ZunaKit
  # Voice channels' media. 2.19 is the first whose senders follow the key
  # provider's current key, which moving to a new epoch's key relies on.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0

targets:
  Zuna:
    type: application
    platform: iOS
    sources:
      - path: Zuna
    dependencies:
      - package: ZunaKit
        product: ZunaHost
      - package: ZunaKit
        product: ZunaModels
      - package: LiveKit
        product: LiveKit
      # Only started in Debug builds, by a launch argument; see CoreController.
      - package: ZunaKit
        product: ZunaControl
      - target: ZunaNotifications
      - target: ZunaBroadcast
      - target: ZunaShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.zuna.mobile
        PRODUCT_NAME: Zuna
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Zuna/Info.plist
      properties:
        CFBundleDisplayName: Zuna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        # Upright, but for a video watched full screen in a call (Orientation in Voice/CallParts.swift).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: chat.zuna.mobile
            CFBundleURLSchemes: [zuna]
        # Plain HTTP only reaches servers on this device or the local network,
        # which the client core already limits to loopback addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Zuna uses Face ID to unlock the app when App Lock is on.
        NSMicrophoneUsageDescription: Zuna uses the microphone for voice and video messages, for videos you take to send, and to talk in calls.
        NSCameraUsageDescription: Zuna uses the camera for video messages, for photos and videos you take to send, and when you turn it on in a call.
        NSLocationWhenInUseUsageDescription: Zuna uses your location only when you choose to share it in a chat.
        NSPhotoLibraryUsageDescription: Zuna shows your photos and videos in the attach menu, for you to pick ones to send.
        # No export documentation needed: only standard, published algorithms (MLS, AES-GCM,
        # XChaCha20-Poly1305 and the like), and the app isn't offered in France, where they'd
        # need a declaration to ANSSI. Offering it there means YES and the code Apple gives.
        ITSAppUsesNonExemptEncryption: false
        ZunaPushRelay: $(ZUNA_PUSH_RELAY)
        NSUserActivityTypes:
          - INSendMessageIntent
        # Silent pushes that clear notifications read or deleted elsewhere, a voice
        # channel that goes on while the app is out of sight, its call handed to the
        # system through CallKit, which refuses an app without voip, and on iOS 27 a
        # screen shared through ScreenCaptureKit while other apps are on it.
        UIBackgroundModes:
          - remote-notification
          - audio
          - voip
          - screen-capture
    entitlements:
      path: Zuna/Zuna.entitlements
      properties:
        aps-environment: development
        # Notifications laid out as conversations, with the sender's picture.
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.chat.zuna.mobile
        keychain-access-groups:
          - $(AppIdentifierPrefix)chat.zuna.shared

  # Decrypts pushed messages so notifications show their text; see NotificationService.
  ZunaNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: ZunaNotifications
      - path: Zuna/Shared/DeviceKeyStore.swift
      - path: Zuna/Shared/Format.swift
      - path: Zuna/Shared/MessageNotification.swift
      - path: Zuna/Shared/PushStore.swift
      - path: Zuna/Shared/SharedStorage.swift
    dependencies:
      - package: ZunaKit
        product: ZunaHost
      - package: ZunaKit
        product: ZunaModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.zuna.mobile.notifications
        PRODUCT_NAME: ZunaNotifications
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZunaNotifications/Info.plist
      properties:
        CFBundleDisplayName: Zuna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: ZunaNotifications/ZunaNotifications.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.chat.zuna.mobile
        keychain-access-groups:
          - $(AppIdentifierPrefix)chat.zuna.shared

  # Records the screen for a call before iOS 27, where ScreenCaptureKit can't; see SampleHandler.
  # LiveKit finds it by name: the app's bundle ID and ".broadcast", in group.<the app's bundle ID>.
  ZunaBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: ZunaBroadcast
      - path: Zuna/Shared/BroadcastSignal.swift
      - path: Zuna/Shared/SharedStorage.swift
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.zuna.mobile.broadcast
        PRODUCT_NAME: ZunaBroadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZunaBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Zuna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: ZunaBroadcast/ZunaBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.chat.zuna.mobile

  # Zuna in the share sheet: sends what another app shares, with a core of its own while the
  # app sleeps, or through the app while it runs; see ShareModel.
  ZunaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ZunaShare
      - path: Zuna/Shared/A11y.swift
      - path: Zuna/Shared/AppLock.swift
      - path: Zuna/Shared/AvatarView.swift
      - path: Zuna/Shared/CoreLock.swift
      - path: Zuna/Shared/DeviceKeyStore.swift
      - path: Zuna/Shared/Format.swift
      - path: Zuna/Shared/Glass.swift
      - path: Zuna/Shared/OutgoingFiles.swift
      - path: Zuna/Shared/PullSearchList.swift
      - path: Zuna/Shared/PushStore.swift
      - path: Zuna/Shared/ShareMailbox.swift
      - path: Zuna/Shared/ShareSuggestions.swift
      - path: Zuna/Shared/SharedStorage.swift
      - path: Zuna/State/AppSettings.swift
      - path: Zuna/Theme/Theme.swift
    dependencies:
      - package: ZunaKit
        product: ZunaHost
      - package: ZunaKit
        product: ZunaModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.zuna.mobile.share
        PRODUCT_NAME: ZunaShare
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZunaShare/Info.plist
      properties:
        CFBundleDisplayName: Zuna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Zuna uses Face ID to unlock the app when App Lock is on.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIUserInterfaceStyle: Dark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # The share sheet's row of people, from the conversations notifications donate.
            IntentsSupported:
              - INSendMessageIntent
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 50
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ZunaShare/ZunaShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.chat.zuna.mobile
        keychain-access-groups:
          - $(AppIdentifierPrefix)chat.zuna.shared

  ZunaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZunaUITests
      - path: Zuna/Shared/A11y.swift
      - path: ZunaKit/Tests/ZunaHostTests/Fixtures/chromium-opus.m4a
        buildPhase: resources
      - path: ZunaKit/Tests/ZunaHostTests/Fixtures/chromium-round.mp4
        buildPhase: resources
      - path: ZunaKit/Tests/ZunaHostTests/Fixtures/firefox-opus.m4a
        buildPhase: resources
      - path: ZunaKit/Tests/ZunaHostTests/Fixtures/firefox-round.mp4
        buildPhase: resources
    dependencies:
      - target: Zuna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.zuna.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Zuna

schemes:
  Zuna:
    build:
      targets:
        Zuna: all
        ZunaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZunaUITests
