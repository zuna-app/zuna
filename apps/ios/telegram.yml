# Telegram, which project.yml takes in when ZUNA_TELEGRAM is set, as the scripts that build the
# app set it for a build given Telegram's api_id (TELEGRAM_API_ID, TELEGRAM_API_HASH). Without it
# the app has no Telegram and needs no TDLib, as the desktop builds without its engine.
#
# A linked Telegram account's TDLib runs in the app's own process (docs/TELEGRAM_PLAN.md, "On the
# iPhone and iPad"), linked statically from what `node scripts/tdlib.mjs --ios` builds into
# apps/ios/.deps, for the app's own deployment target. ZUNA_TELEGRAM is what Swift is built with
# beside it, which Zuna/Telegram/TDLibEngine.swift names TDLib behind, and TDLib's functions reach
# Swift as a module of their own (apps/ios/TDLib), not through a bridging header on the whole app.

targets:
  Zuna:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ZUNA_TELEGRAM
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/TDLib
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/.deps/tdlib/$(PLATFORM_NAME)/lib
        OTHER_LDFLAGS: $(inherited) -ltdjson_static -ltdjson_private -ltdclient -ltdcore -ltdmtproto -ltdapi -ltde2e -ltddb -ltdsqlite -ltdnet -ltdactor -ltdutils -lssl -lcrypto -lz -lc++
